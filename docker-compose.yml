services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acm-amtics-website
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - MONGODB_URI=${MONGODB_URI:-}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-acm_amtics_admin_db}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@amtics.acm.org}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
