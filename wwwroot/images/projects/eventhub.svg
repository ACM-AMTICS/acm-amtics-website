<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="eventBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#eventBg)"/>

  <!-- Brand Title -->
  <text x="40" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#FFFFFF">EventHub</text>
  <rect x="40" y="70" width="70" height="4" rx="2" fill="#6366F1"/>

  <!-- Left: Event Card Preview -->
  <g transform="translate(40, 95)">
    <rect width="260" height="190" rx="12" fill="#1E293B" stroke="rgba(255,255,255,0.08)"/>
    <rect width="260" height="90" rx="12" fill="#312E81"/>
    <text x="20" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF">ACM CodeSprint 2025</text>
    <text x="20" y="68" font-family="sans-serif" font-size="11" fill="#A5B4FC">24hr Student Hackathon</text>

    <!-- Ticket QR Preview -->
    <rect x="20" y="110" width="45" height="45" rx="6" fill="#FFFFFF"/>
    <rect x="25" y="115" width="15" height="15" fill="#000"/>
    <rect x="45" y="135" width="15" height="15" fill="#000"/>
    <text x="75" y="130" font-family="sans-serif" font-size="12" font-weight="700" fill="#F1F5F9">Registered Pass</text>
    <text x="75" y="148" font-family="sans-serif" font-size="10" fill="#94A3B8">Seminar Hall &bull; Confirmed</text>
  </g>

  <!-- Right: Metrics & Speakers Grid -->
  <g transform="translate(330, 95)">
    <!-- Metric 1 -->
    <rect width="230" height="60" rx="10" fill="#1E293B" stroke="rgba(255,255,255,0.06)"/>
    <circle cx="35" cy="30" r="14" fill="#6366F1"/>
    <text x="60" y="27" font-family="sans-serif" font-size="10" font-weight="600" fill="#94A3B8">ATTENDEES SERVED</text>
    <text x="60" y="47" font-family="sans-serif" font-size="16" font-weight="800" fill="#38BDF8">1,850+ Students</text>

    <!-- Metric 2 -->
    <rect y="75" width="230" height="60" rx="10" fill="#1E293B" stroke="rgba(255,255,255,0.06)"/>
    <circle cx="35" cy="105" r="14" fill="#10B981"/>
    <text x="60" y="102" font-family="sans-serif" font-size="10" font-weight="600" fill="#94A3B8">WORKSHOPS HOSTED</text>
    <text x="60" y="122" font-family="sans-serif" font-size="16" font-weight="800" fill="#34D399">34 Sessions</text>

    <!-- Pill Button -->
    <rect y="150" width="230" height="40" rx="8" fill="#4F46E5"/>
    <text x="70" y="175" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Discover Events &rarr;</text>
  </g>
</svg>
