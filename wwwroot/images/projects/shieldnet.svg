<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0B1329"/>
    </linearGradient>
    <linearGradient id="cyberBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="cBloom">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#shieldBg)"/>

  <!-- Network Circuit Lines -->
  <g stroke="#1E293B" stroke-width="1.5" fill="none">
    <path d="M0,170 H200 L250,220 H350 L400,170 H600"/>
    <path d="M100,50 L180,120 V220 L100,290"/>
    <path d="M500,50 L420,120 V220 L500,290"/>
    <circle cx="200" cy="170" r="4" fill="#38BDF8"/>
    <circle cx="400" cy="170" r="4" fill="#38BDF8"/>
  </g>

  <!-- Glowing Radar Rings -->
  <circle cx="300" cy="170" r="110" fill="none" stroke="#0284C7" stroke-width="1" opacity="0.3"/>
  <circle cx="300" cy="170" r="85" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <circle cx="300" cy="170" r="55" fill="#0369A1" opacity="0.15" filter="url(#cBloom)"/>

  <!-- Center Shield Icon -->
  <g transform="translate(300, 160)">
    <path d="M0,-45 L35,-25 V5 C35,32 0,55 0,55 C0,55 -35,32 -35,5 V-25 Z" fill="none" stroke="url(#cyberBlue)" stroke-width="4" filter="url(#cBloom)"/>
    <path d="M0,-35 L26,-19 V5 C26,26 0,44 0,44 C0,44 -26,26 -26,5 V-19 Z" fill="#0C4A6E" opacity="0.6"/>
    <!-- Keyhole -->
    <path d="M-6,-4 C-6,-8 -3,-11 0,-11 C3,-11 6,-8 6,-4 C6,-1 3,1 2,3 L4,15 H-4 L-2,3 C-3,1 -6,-1 -6,-4 Z" fill="#38BDF8"/>
  </g>

  <!-- Top Security Status Bar -->
  <rect x="40" y="30" width="160" height="30" rx="8" fill="#0F172A" stroke="rgba(56, 189, 248, 0.3)"/>
  <circle cx="55" cy="45" r="5" fill="#10B981"/>
  <text x="70" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">SURVEILLANCE: ACTIVE</text>
</svg>
