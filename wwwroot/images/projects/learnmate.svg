<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="learnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1035"/>
      <stop offset="100%" stop-color="#0F0920"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="pGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#learnBg)"/>

  <!-- AI Glowing Circle Motif -->
  <g transform="translate(180, 160)">
    <circle cx="0" cy="0" r="110" fill="#7C3AED" opacity="0.12" filter="url(#pGlow)"/>
    <circle cx="0" cy="0" r="70" fill="#6366F1" opacity="0.25"/>
    <text x="0" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-1">AI</text>
  </g>

  <!-- Right Side Interactive Study Cards -->
  <g transform="translate(320, 50)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="240" height="90" rx="14" fill="#2E1B4E" stroke="rgba(167, 139, 250, 0.3)"/>
    <circle cx="28" cy="28" r="10" fill="#8B5CF6"/>
    <rect x="50" y="24" width="120" height="9" rx="4" fill="#E2E8F0" opacity="0.8"/>
    <rect x="24" y="52" width="190" height="6" rx="3" fill="#94A3B8" opacity="0.4"/>
    <rect x="24" y="66" width="140" height="6" rx="3" fill="#94A3B8" opacity="0.4"/>

    <!-- Card 2 (Quiz Generator) -->
    <rect x="20" y="105" width="220" height="120" rx="14" fill="#24143D" stroke="rgba(167, 139, 250, 0.2)"/>
    <rect x="40" y="125" width="100" height="8" rx="4" fill="#A78BFA"/>
    <rect x="40" y="148" width="160" height="22" rx="6" fill="#3B2263"/>
    <rect x="40" y="178" width="160" height="22" rx="6" fill="#6366F1" opacity="0.6"/>
  </g>
</svg>
