<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#mapBg)"/>

  <!-- Isometric Campus Paths & Buildings -->
  <g opacity="0.6">
    <!-- Road lines -->
    <path d="M-20,120 L250,80 L420,180 L620,140" stroke="#BFDBFE" stroke-width="24" fill="none"/>
    <path d="M250,80 L300,360" stroke="#BFDBFE" stroke-width="18" fill="none"/>
    <path d="M420,180 L380,360" stroke="#BFDBFE" stroke-width="14" fill="none"/>
    <path d="M120,-10 L150,220" stroke="#BFDBFE" stroke-width="14" fill="none"/>

    <!-- Building blocks -->
    <polygon points="60,180 180,140 180,220 60,260" fill="#93C5FD"/>
    <polygon points="180,140 260,165 260,245 180,220" fill="#60A5FA"/>
    <polygon points="60,180 140,155 260,165 180,140" fill="#DBEAFE"/>

    <polygon points="450,70 540,40 540,100 450,130" fill="#93C5FD"/>
    <polygon points="540,40 590,55 590,115 540,100" fill="#60A5FA"/>
  </g>

  <!-- Route Line in Purple -->
  <path d="M 120,200 Q 220,140 320,180 T 460,130" fill="none" stroke="#6366F1" stroke-width="4" stroke-dasharray="6,4"/>

  <!-- Map Pin Center -->
  <g transform="translate(320, 150)">
    <circle cx="0" cy="0" r="28" fill="#6366F1" opacity="0.2"/>
    <circle cx="0" cy="0" r="16" fill="#4F46E5"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
    <!-- Ripple ring -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#6366F1" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Destination Pin -->
  <g transform="translate(460, 110)">
    <path d="M0,0 C-10,-10 -15,-20 -15,-30 C-15,-42 -4,-48 0,-48 C4,-48 15,-42 15,-30 C15,-20 10,-10 0,0 Z" fill="#EF4444"/>
    <circle cx="0" cy="-30" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Navigation Pill Badge UI -->
  <g transform="translate(30, 30)">
    <rect width="180" height="38" rx="19" fill="#FFFFFF" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.08))"/>
    <circle cx="22" cy="19" r="10" fill="#10B981"/>
    <text x="42" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1E293B">AMTICS Campus 3D</text>
  </g>
</svg>
