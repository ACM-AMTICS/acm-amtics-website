<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#warmBg)"/>

  <!-- Left: Calm Floating Elements & Logo -->
  <g transform="translate(60, 80)">
    <circle cx="80" cy="80" r="70" fill="#FDBA74" opacity="0.3"/>
    <circle cx="80" cy="80" r="40" fill="#FB923C" opacity="0.4"/>
    <text x="0" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" fill="#9A3412">MindSpace</text>
    <text x="0" y="48" font-family="sans-serif" font-size="13" fill="#C2410C" font-weight="500">Student Mental Wellness</text>
    
    <!-- Mood Slider Preview -->
    <rect x="0" y="110" width="200" height="12" rx="6" fill="#FED7AA"/>
    <rect x="0" y="110" width="130" height="12" rx="6" fill="#F97316"/>
    <circle cx="130" cy="116" r="10" fill="#EA580C" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.15))"/>
  </g>

  <!-- Right: Modern Phone Frame Mockup -->
  <g transform="translate(370, 25)">
    <rect width="180" height="300" rx="30" fill="#FFFFFF" filter="drop-shadow(0 15px 25px rgba(234, 88, 12, 0.15))" stroke="#FED7AA" stroke-width="2"/>
    <!-- Speaker notch -->
    <rect x="65" y="10" width="50" height="5" rx="2.5" fill="#E2E8F0"/>
    
    <!-- Inside UI -->
    <text x="25" y="45" font-family="sans-serif" font-weight="700" font-size="13" fill="#1E293B">Today's Check-in</text>
    
    <!-- Mood Emoticon Card -->
    <rect x="20" y="60" width="140" height="70" rx="14" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
    <circle cx="50" cy="95" r="18" fill="#FDE047"/>
    <!-- Smiling face -->
    <circle cx="44" cy="92" r="2" fill="#713F12"/>
    <circle cx="56" cy="92" r="2" fill="#713F12"/>
    <path d="M44,98 Q50,105 56,98" stroke="#713F12" stroke-width="1.8" fill="none"/>
    <text x="78" y="94" font-family="sans-serif" font-weight="700" font-size="12" fill="#9A3412">Feeling</text>
    <text x="78" y="107" font-family="sans-serif" font-weight="600" font-size="11" fill="#EA580C">Peaceful</text>

    <!-- Support Resources list -->
    <rect x="20" y="145" width="140" height="36" rx="8" fill="#F1F5F9"/>
    <circle cx="36" cy="163" r="6" fill="#10B981"/>
    <text x="50" y="167" font-family="sans-serif" font-size="10" font-weight="600" fill="#475569">Peer Support</text>

    <rect x="20" y="190" width="140" height="36" rx="8" fill="#F1F5F9"/>
    <circle cx="36" cy="208" r="6" fill="#6366F1"/>
    <text x="50" y="212" font-family="sans-serif" font-size="10" font-weight="600" fill="#475569">Crisis Hotline</text>

    <rect x="20" y="235" width="140" height="36" rx="8" fill="#F97316"/>
    <text x="55" y="257" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Journal</text>
  </g>
</svg>
