<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#bg)"/>
  
  <!-- Subtle Grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="600" height="340" fill="url(#grid)"/>

  <!-- Left Sidebar / Brand Area -->
  <text x="35" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" letter-spacing="-0.5">EcoTrack</text>
  <rect x="35" y="70" width="110" height="6" rx="3" fill="#10B981" opacity="0.8"/>

  <!-- Top Metric Cards -->
  <rect x="35" y="95" width="130" height="75" rx="10" fill="#1E293B" stroke="rgba(255,255,255,0.06)"/>
  <text x="50" y="125" font-family="sans-serif" font-size="11" fill="#94A3B8" font-weight="600">CARBON OFFSET</text>
  <text x="50" y="152" font-family="sans-serif" font-size="20" fill="#10B981" font-weight="800">-34.8%</text>

  <rect x="180" y="95" width="130" height="75" rx="10" fill="#1E293B" stroke="rgba(255,255,255,0.06)"/>
  <text x="195" y="125" font-family="sans-serif" font-size="11" fill="#94A3B8" font-weight="600">CAMPUS KWH</text>
  <text x="195" y="152" font-family="sans-serif" font-size="20" fill="#38BDF8" font-weight="800">1,240</text>

  <!-- Large Chart Card -->
  <rect x="35" y="185" width="275" height="120" rx="12" fill="#1E293B" stroke="rgba(255,255,255,0.06)"/>
  <text x="50" y="210" font-family="sans-serif" font-size="11" fill="#CBD5E1" font-weight="600">Weekly Energy Trend</text>
  <path d="M 50 280 C 90 270, 110 240, 140 250 C 170 260, 200 220, 240 230 C 270 240, 280 200, 290 205" fill="none" stroke="url(#greenGlow)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="290" cy="205" r="5" fill="#34D399" filter="url(#glow)"/>

  <!-- Right Visual: Glowing Plant / Earth Silhouette -->
  <g transform="translate(420, 150)">
    <circle cx="50" cy="20" r="90" fill="#10B981" opacity="0.08" filter="url(#glow)"/>
    <circle cx="50" cy="20" r="60" fill="#047857" opacity="0.15"/>
    <!-- Eco Leaf Silhouette -->
    <path d="M50,-40 C80,-10 90,40 50,80 C10,40 20,-10 50,-40 Z" fill="url(#greenGlow)" opacity="0.9"/>
    <path d="M50,-35 L50,75 M50,0 Q65,10 70,25 M50,20 Q35,30 30,45" stroke="#064E3B" stroke-width="2.5" fill="none"/>
  </g>
</svg>
