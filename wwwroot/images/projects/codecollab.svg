<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="ideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#ideBg)"/>

  <!-- Window Header -->
  <rect x="25" y="20" width="550" height="300" rx="14" fill="#1E293B" stroke="rgba(255,255,255,0.08)"/>
  <rect x="25" y="20" width="550" height="38" rx="14" fill="#0F172A"/>
  <!-- Window buttons -->
  <circle cx="50" cy="39" r="5" fill="#EF4444"/>
  <circle cx="68" cy="39" r="5" fill="#F59E0B"/>
  <circle cx="86" cy="39" r="5" fill="#10B981"/>
  <text x="120" y="44" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" fill="#94A3B8">App.tsx &bull; CodeCollab Live Sync</text>

  <!-- Online collaborator chips on top right -->
  <g transform="translate(430, 29)">
    <circle cx="0" cy="10" r="10" fill="#6366F1"/>
    <text x="0" y="14" font-family="sans-serif" font-size="9" font-weight="700" fill="#FFF" text-anchor="middle">TS</text>
    <circle cx="22" cy="10" r="10" fill="#10B981"/>
    <text x="22" y="14" font-family="sans-serif" font-size="9" font-weight="700" fill="#FFF" text-anchor="middle">IP</text>
    <circle cx="44" cy="10" r="10" fill="#F43F5E"/>
    <text x="44" y="14" font-family="sans-serif" font-size="9" font-weight="700" fill="#FFF" text-anchor="middle">HV</text>
  </g>

  <!-- Left Sidebar (Explorer) -->
  <rect x="25" y="58" width="130" height="262" fill="#0F172A" opacity="0.6"/>
  <text x="45" y="90" font-family="sans-serif" font-size="11" fill="#64748B" font-weight="700">EXPLORER</text>
  <text x="55" y="120" font-family="monospace" font-size="11" fill="#38BDF8">&gt; src</text>
  <text x="65" y="145" font-family="monospace" font-size="11" fill="#E2E8F0">&bull; App.tsx</text>
  <text x="65" y="170" font-family="monospace" font-size="11" fill="#94A3B8">&bull; socket.ts</text>
  <text x="65" y="195" font-family="monospace" font-size="11" fill="#94A3B8">&bull; room.tsx</text>

  <!-- Code Area -->
  <g transform="translate(175, 80)" font-family="'JetBrains Mono', monospace" font-size="12">
    <!-- Line numbers -->
    <text x="0" y="20" fill="#475569">1</text>
    <text x="0" y="45" fill="#475569">2</text>
    <text x="0" y="70" fill="#475569">3</text>
    <text x="0" y="95" fill="#475569">4</text>
    <text x="0" y="120" fill="#475569">5</text>
    <text x="0" y="145" fill="#475569">6</text>
    <text x="0" y="170" fill="#475569">7</text>

    <!-- Syntax colored code -->
    <text x="30" y="20"><tspan fill="#C084FC">import</tspan> <tspan fill="#38BDF8">{ useCollaborate }</tspan> <tspan fill="#C084FC">from</tspan> <tspan fill="#4ADE80">'@acm/collab'</tspan>;</text>
    <text x="30" y="45"><tspan fill="#F472B6">export const</tspan> <tspan fill="#60A5FA">EditorSession</tspan> = () => {</text>
    <text x="50" y="70"><tspan fill="#F472B6">const</tspan> { <tspan fill="#38BDF8">doc</tspan>, <tspan fill="#38BDF8">peers</tspan> } = <tspan fill="#60A5FA">useSyncRoom</tspan>();</text>
    <text x="50" y="95"><tspan fill="#C084FC">return</tspan> (</text>
    <text x="70" y="120">&lt;<tspan fill="#38BDF8">MonacoEditor</tspan> <tspan fill="#FBBF24">presence</tspan>={peers} /&gt;</text>
    
    <!-- Remote Cursor for Peer -->
    <rect x="235" y="105" width="2" height="18" fill="#F43F5E"/>
    <rect x="235" y="90" width="45" height="16" rx="4" fill="#F43F5E"/>
    <text x="240" y="102" font-size="9" fill="#FFF" font-family="sans-serif">Isha P.</text>

    <text x="50" y="145">);</text>
    <text x="30" y="170">};</text>
  </g>
</svg>
